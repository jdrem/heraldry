plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation libs.bundles.org.apache.xmlgraphics
    testImplementation libs.junit.junit
}

group = 'net.remgant'
version = '1.0-SNAPSHOT'
description = 'heraldry'

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
